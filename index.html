<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HCI Interactive Master Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
      }
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 0;
    }
    button { cursor: pointer; }
    select, input, button { font-family: inherit; }
  </style>
</head>
<body class="p-4 md:p-6 antialiased min-h-screen">

      <div>
        <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-400 mb-2">
          <span>🎓</span> NPTEL / HCI Complete Course
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">HCI Master Quiz App</h1>
        <p class="text-sm text-slate-400 mt-1">120 Questions across Weeks 1 – 12 • Practice, Exam & Random Modes</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="quickRandomBtn" class="px-3.5 py-1.5 text-xs font-medium rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-sm">
          🎲 Quick Random Quiz
        </button>
        <button id="resetBtn" class="px-3.5 py-1.5 text-xs font-medium rounded-lg border hover:bg-slate-800 transition" style="border-color: var(--border-color);">
          🔄 Reset
        </button>
        <button id="toggleReviewBtn" class="px-3.5 py-1.5 text-xs font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-500 transition shadow-sm">
          📋 Key
        </button>
      </div>
    </header>

    <!-- Controls Bar -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-3 p-4 rounded-xl border" style="background-color: var(--card-bg); border-color: var(--border-color);">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Select Module / Week</label>
        <select id="weekFilter" class="w-full text-sm rounded-lg p-2 bg-slate-900 border focus:ring-2 focus:ring-blue-500 text-slate-200" style="border-color: var(--border-color);">
          <option value="all">All Weeks (120 Questions)</option>
          <option value="1">Week 1: Intro to HCI & Good Design</option>
          <option value="2">Week 2: UX, Accessibility & Roles</option>
          <option value="3">Week 3: Design Thinking & Double Diamond</option>
          <option value="4">Week 4: User Perspectives & Personas</option>
          <option value="5">Week 5: Interaction Types & Metaphors</option>
          <option value="6">Week 6: Research Methods & Data Analysis</option>
          <option value="7">Week 7: Prototyping & Storyboards</option>
          <option value="8">Week 8: Usability Evaluation & Metrics</option>
          <option value="9">Week 9: IoT, Wearables & Novel Interfaces</option>
          <option value="10">Week 10: LLMs, Prompting & Human-AI</option>
          <option value="11">Week 11: Privacy, Security & Ethics</option>
          <option value="12">Week 12: Conversational AI & Dialogue Systems</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Quiz Mode</label>
        <select id="modeSelect" class="w-full text-sm rounded-lg p-2 bg-slate-900 border focus:ring-2 focus:ring-blue-500 text-slate-200" style="border-color: var(--border-color);">
          <option value="practice">Practice Mode (Instant Feedback)</option>
          <option value="test">Exam Mode (Submit at End)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Question Order / Random</label>
        <select id="randomSelect" class="w-full text-sm rounded-lg p-2 bg-slate-900 border focus:ring-2 focus:ring-blue-500 text-slate-200" style="border-color: var(--border-color);">
          <option value="normal">Normal (Sequential)</option>
          <option value="random-all">🔀 Random (All Shuffled)</option>
          <option value="random-10">🔀 Random 10 (Quick Sprint)</option>
          <option value="random-25">🔀 Random 25 (Standard Practice)</option>
          <option value="random-50">🔀 Random 50 (Mock Exam)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Quick Search / Topic</label>
        <input type="text" id="searchInput" placeholder="e.g. Norman, GDPR..." class="w-full text-sm rounded-lg p-2 bg-slate-900 border focus:ring-2 focus:ring-blue-500 text-slate-200 placeholder-slate-500" style="border-color: var(--border-color);">
      </div>
    </div>

    <!-- Random & Extra Options Sub-Bar -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6 px-4 py-2.5 rounded-xl border text-xs" style="background-color: var(--card-bg); border-color: var(--border-color);">

        <button id="reshuffleBtn" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition shadow-sm">
          <span>🔀</span> Reshuffle Order
        </button>
        <label class="inline-flex items-center gap-2 cursor-pointer text-slate-300 hover:text-white select-none">
          <input type="checkbox" id="shuffleOptionsToggle" class="rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-blue-500">
          <span>Shuffle Options (A, B, C, D)</span>
        </label>
      </div>
      <div id="randomStatusBadge" class="hidden text-xs px-2.5 py-1 rounded-md bg-purple-900/40 text-purple-300 border border-purple-700/50 font-medium">
        🎲 Random Mode Active
      </div>
    </div>

    <!-- Stats & Progress -->
    <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
      <span id="progressText">Question 1 of 120</span>
      <div class="flex items-center gap-3">
        <span>Score: <b id="scoreVal" class="text-emerald-400">0</b> / <span id="totalAttempted">0</span></span>
        <span class="text-blue-400 font-semibold" id="pctVal">(0%)</span>
      </div>
    </div>
    <div class="w-full bg-slate-800 rounded-full h-2 mb-6 overflow-hidden">
      <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 1%"></div>
    </div>

    <!-- Question Container -->
    <main id="quizContainer" class="p-6 rounded-2xl border shadow-lg relative mb-6" style="background-color: var(--card-bg); border-color: var(--border-color);">
      <!-- Question Header -->
      <div class="flex items-center justify-between gap-2 mb-3">
        <span id="badgeWeek" class="text-xs px-2.5 py-0.5 rounded-md font-semibold bg-blue-900/40 text-blue-300 border border-blue-700/50">Week 1</span>
        <span id="badgeNum" class="text-xs text-slate-400">Q1</span>
      </div>

      <h2 id="questionText" class="text-lg sm:text-xl font-semibold leading-relaxed mb-6">
        What does HCI stand for?
      </h2>

      <!-- Options -->
      <div id="optionsContainer" class="space-y-3 mb-6">
        <!-- Injected via JS -->
      </div>

      <!-- Feedback Banner (Practice Mode) -->
      <div id="feedbackBanner" class="hidden p-4 rounded-xl text-sm font-medium border mb-6"></div>

      <!-- Navigation Footer -->
      <div class="flex items-center justify-between pt-4 border-t" style="border-color: var(--border-color);">
        <button id="prevBtn" class="px-4 py-2 text-sm font-medium rounded-lg border hover:bg-slate-800 disabled:opacity-30 disabled:pointer-events-none transition" style="border-color: var(--border-color);">
          ← Previous
        </button>

        <div class="flex gap-2">
          <button id="showAnswerBtn" class="px-4 py-2 text-sm font-medium rounded-lg border border-amber-500/40 text-amber-400 hover:bg-amber-500/10 transition">
            💡 Reveal Answer
          </button>
          <button id="nextBtn" class="px-5 py-2 text-sm font-medium rounded-lg bg-blue-600 hover:bg-blue-500 text-white transition">
            Next →
          </button>
        </div>
      </div>
    </main>

    <!-- Question Palette -->
    <div class="p-4 rounded-xl border mb-6" style="background-color: var(--card-bg); border-color: var(--border-color);">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Question Navigator</h3>
        <div class="flex items-center gap-3 text-xs text-slate-400">
          <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Correct</span>
          <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-red-500"></span> Incorrect</span>
          <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-slate-700"></span> Unanswered</span>
        </div>
      </div>
      <div id="questionGrid" class="flex flex-wrap gap-1.5 max-h-44 overflow-y-auto pr-1">
        <!-- Buttons injected via JS -->
      </div>
    </div>

    <!-- Full Answer Key Modal / Section -->
    <section id="fullKeySection" class="hidden p-6 rounded-2xl border" style="background-color: var(--card-bg); border-color: var(--border-color);">
      <div class="flex items-center justify-between mb-4 border-b pb-3" style="border-color: var(--border-color);">
        <h3 class="text-lg font-bold">Comprehensive Answer Key & Reference</h3>
        <button id="closeKeyBtn" class="text-xs text-slate-400 hover:text-white">✕ Close</button>
      </div>
      <div id="keyContent" class="space-y-6 max-h-[500px] overflow-y-auto pr-2 text-sm">
        <!-- Rendered via JS -->
      </div>
    </section>

  </div>

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // State
    let filteredQuestions = [...questionsData];
    let currentIndex = 0;
    let userAnswers = {};
    let currentMode = 'practice';

    // Elements
    const weekFilter = document.getElementById('weekFilter');
    const modeSelect = document.getElementById('modeSelect');
    const randomSelect = document.getElementById('randomSelect');
    const searchInput = document.getElementById('searchInput');
    const reshuffleBtn = document.getElementById('reshuffleBtn');
    const quickRandomBtn = document.getElementById('quickRandomBtn');
    const shuffleOptionsToggle = document.getElementById('shuffleOptionsToggle');
    const randomStatusBadge = document.getElementById('randomStatusBadge');

    const progressText = document.getElementById('progressText');
    const scoreVal = document.getElementById('scoreVal');
    const totalAttempted = document.getElementById('totalAttempted');
    const pctVal = document.getElementById('pctVal');
    const progressBar = document.getElementById('progressBar');
    const badgeWeek = document.getElementById('badgeWeek');
    const badgeNum = document.getElementById('badgeNum');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedbackBanner = document.getElementById('feedbackBanner');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const showAnswerBtn = document.getElementById('showAnswerBtn');
    const questionGrid = document.getElementById('questionGrid');
    const resetBtn = document.getElementById('resetBtn');
    const toggleReviewBtn = document.getElementById('toggleReviewBtn');
    const fullKeySection = document.getElementById('fullKeySection');
    const keyContent = document.getElementById('keyContent');
    const closeKeyBtn = document.getElementById('closeKeyBtn');

    function applyFilter(resetIndex = true) {
      const selectedWeek = weekFilter.value;
      const query = searchInput.value.trim().toLowerCase();
      const randomMode = randomSelect.value;
      const shuffleOptions = shuffleOptionsToggle.checked;

      let baseList = questionsData.filter(item => {
        const matchesWeek = (selectedWeek === 'all') || (item.week.toString() === selectedWeek);
        const matchesQuery = !query || 
          item.q.toLowerCase().includes(query) || 
          item.options.some(opt => opt.toLowerCase().includes(query)) ||
          item.topic.toLowerCase().includes(query);
        return matchesWeek && matchesQuery;
      });

      if (randomMode !== 'normal') {
        baseList = shuffleArray(baseList);
        if (randomMode === 'random-10') baseList = baseList.slice(0, 10);
        else if (randomMode === 'random-25') baseList = baseList.slice(0, 25);
        else if (randomMode === 'random-50') baseList = baseList.slice(0, 50);

        randomStatusBadge.classList.remove('hidden');
        randomStatusBadge.textContent = `🎲 Random Mode (${baseList.length} Questions)`;
      } else {
        randomStatusBadge.classList.add('hidden');
      }

      // Option Shuffling
      filteredQuestions = baseList.map(item => {
        let displayOpts = item.options.map((text, origIdx) => ({ text, origIdx }));
        if (shuffleOptions) {
          displayOpts = shuffleArray(displayOpts);
        }
        return {
          ...item,
          displayOptions: displayOpts
        };
      });

      if (resetIndex || currentIndex >= filteredQuestions.length) {
        currentIndex = 0;
      }

      renderQuestion();
      renderGrid();
      updateScoreboard();
    }

    function renderQuestion() {
      if (filteredQuestions.length === 0) {
        questionText.textContent = "No questions match your filter.";
        optionsContainer.innerHTML = "";
        feedbackBanner.classList.add('hidden');
        badgeWeek.textContent = "N/A";
        badgeNum.textContent = "0/0";
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        showAnswerBtn.disabled = true;
        return;
      }

      const q = filteredQuestions[currentIndex];
      const qKey = `${q.week}_${q.id}`;
      const answeredOption = userAnswers[qKey];

      badgeWeek.textContent = `Week ${q.week}`;
      badgeNum.textContent = `Question ${currentIndex + 1} of ${filteredQuestions.length} • ${q.topic}`;
      questionText.textContent = `${currentIndex + 1}. ${q.q}`;

      optionsContainer.innerHTML = '';
      feedbackBanner.classList.add('hidden');
      feedbackBanner.className = 'p-4 rounded-xl text-sm font-medium border mb-6 hidden';

      const letters = ['A', 'B', 'C', 'D'];
      const currentOpts = q.displayOptions || q.options.map((text, origIdx) => ({ text, origIdx }));

      currentOpts.forEach((optObj, idx) => {
        const optBtn = document.createElement('button');
        optBtn.className = 'w-full text-left p-3.5 rounded-xl border flex items-center justify-between text-sm transition-all duration-150 ';

        let isCorrect = optObj.origIdx === q.answer;
        let isSelected = answeredOption === optObj.origIdx;

        if (answeredOption !== undefined) {
          if (currentMode === 'practice') {
            if (isCorrect) {
              optBtn.className += 'bg-emerald-950/40 border-emerald-500 text-emerald-200 font-medium';
            } else if (isSelected) {
              optBtn.className += 'bg-red-950/40 border-red-500 text-red-200 font-medium';
            } else {
              optBtn.className += 'opacity-50 border-slate-700 bg-slate-900/40';
            }
          } else {
            if (isSelected) {
              optBtn.className += 'bg-blue-600/30 border-blue-500 text-blue-100 font-semibold';
            } else {
              optBtn.className += 'border-slate-800 bg-slate-900/60 hover:bg-slate-800';
            }
          }
        } else {
          optBtn.className += 'border-slate-800 bg-slate-900/60 hover:border-blue-500 hover:bg-slate-800/80 cursor-pointer';
        }

        optBtn.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border border-slate-700 text-slate-300">${letters[idx]}</span>
            <span>${optObj.text}</span>
          </div>
          ${(answeredOption !== undefined && currentMode === 'practice') ? (
            isCorrect ? '<span class="text-emerald-400 font-bold">✓ Accepted</span>' : 
            (isSelected ? '<span class="text-red-400 font-bold">✗ Incorrect</span>' : '')
          ) : ''}
        `;

        optBtn.onclick = () => selectOption(optObj.origIdx);
        optionsContainer.appendChild(optBtn);
      });

      if (answeredOption !== undefined && currentMode === 'practice') {
        const correct = answeredOption === q.answer;
        feedbackBanner.classList.remove('hidden');
        if (correct) {
          feedbackBanner.classList.add('bg-emerald-950/50', 'border-emerald-600/60', 'text-emerald-200');
          feedbackBanner.innerHTML = `🎉 <b>Correct!</b> The accepted answer is: <i>${q.options[q.answer]}</i>`;
        } else {
          feedbackBanner.classList.add('bg-red-950/50', 'border-red-600/60', 'text-red-200');
          feedbackBanner.innerHTML = `❌ <b>Incorrect.</b> The accepted answer is: <b class="text-emerald-300">${q.options[q.answer]}</b>`;
        }
      }

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === filteredQuestions.length - 1;
      showAnswerBtn.disabled = false;

      progressText.textContent = `Question ${currentIndex + 1} of ${filteredQuestions.length}`;
      const pct = Math.round(((currentIndex + 1) / filteredQuestions.length) * 100);
      progressBar.style.width = `${pct}%`;

      renderGrid();
    }

    function selectOption(origIdx) {
      const q = filteredQuestions[currentIndex];
      const qKey = `${q.week}_${q.id}`;
      userAnswers[qKey] = origIdx;
      renderQuestion();
      updateScoreboard();
    }

    function renderGrid() {
      questionGrid.innerHTML = '';
      filteredQuestions.forEach((q, i) => {
        const qKey = `${q.week}_${q.id}`;
        const answered = userAnswers[qKey];
        const btn = document.createElement('button');
        btn.textContent = i + 1;
        btn.className = 'w-7 h-7 text-xs font-medium rounded transition flex items-center justify-center ';

        if (i === currentIndex) {
          btn.className += 'ring-2 ring-blue-400 scale-105 font-bold ';
        }

        if (answered !== undefined) {
          if (currentMode === 'practice') {
            if (answered === q.answer) {
              btn.className += 'bg-emerald-600 text-white';
            } else {
              btn.className += 'bg-red-600 text-white';
            }
          } else {
            btn.className += 'bg-blue-600 text-white';
          }
        } else {
          btn.className += 'bg-slate-800 text-slate-400 hover:bg-slate-700';
        }

        btn.onclick = () => {
          currentIndex = i;
          renderQuestion();
        };
        questionGrid.appendChild(btn);
      });
    }

    function updateScoreboard() {
      let correctCount = 0;
      let totalCount = 0;

      filteredQuestions.forEach(q => {
        const qKey = `${q.week}_${q.id}`;
        if (userAnswers[qKey] !== undefined) {
          totalCount++;
          if (userAnswers[qKey] === q.answer) {
            correctCount++;
          }
        }
      });

      scoreVal.textContent = correctCount;
      totalAttempted.textContent = totalCount;
      const pct = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
      pctVal.textContent = `(${pct}%)`;
    }

    prevBtn.onclick = () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    };

    nextBtn.onclick = () => {
      if (currentIndex < filteredQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    };

    showAnswerBtn.onclick = () => {
      const q = filteredQuestions[currentIndex];
      const qKey = `${q.week}_${q.id}`;
      userAnswers[qKey] = q.answer;
      renderQuestion();
      updateScoreboard();
    };

    weekFilter.onchange = () => applyFilter(true);
    searchInput.oninput = () => applyFilter(true);

    modeSelect.onchange = () => {
      currentMode = modeSelect.value;
      renderQuestion();
      renderGrid();
    };

    randomSelect.onchange = () => {
      applyFilter(true);
    };

    reshuffleBtn.onclick = () => {
      if (randomSelect.value === 'normal') {
        randomSelect.value = 'random-all';
      }
      applyFilter(true);
    };

    quickRandomBtn.onclick = () => {
      randomSelect.value = 'random-25';
      weekFilter.value = 'all';
      searchInput.value = '';
      applyFilter(true);
    };

    shuffleOptionsToggle.onchange = () => {
      applyFilter(false);
    };

    resetBtn.onclick = () => {
      if (confirm("Are you sure you want to reset your quiz answers?")) {
        userAnswers = {};
        currentIndex = 0;
        renderQuestion();
        updateScoreboard();
      }
    };

    toggleReviewBtn.onclick = () => {
      renderFullKey();
      fullKeySection.classList.toggle('hidden');
      if (!fullKeySection.classList.contains('hidden')) {
        fullKeySection.scrollIntoView({ behavior: 'smooth' });
      }
    };

    closeKeyBtn.onclick = () => {
      fullKeySection.classList.add('hidden');
    };

    function renderFullKey() {
      let html = '';
      for (let w = 1; w <= 12; w++) {
        const weekQs = questionsData.filter(q => q.week === w);
        html += `
          <div class="border rounded-xl p-4 bg-slate-900/50" style="border-color: var(--border-color);">
            <h4 class="font-bold text-blue-400 mb-3 text-base">Week ${w} Assignment Key</h4>
            <div class="space-y-2">
        `;
        weekQs.forEach((item, i) => {
          html += `
            <div class="text-xs pb-2 border-b border-slate-800/80">
              <span class="font-semibold text-slate-300">${i + 1}. ${item.q}</span><br>
              <span class="text-emerald-400 font-medium">✓ Accepted: ${item.options[item.answer]}</span>
            </div>
          `;
        });
        html += `</div></div>`;
      }
      keyContent.innerHTML = html;
    }

    applyFilter();
  </script>
